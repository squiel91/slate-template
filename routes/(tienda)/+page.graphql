{
  featured_collections: collections(first: 6) {
    nodes {
      name
      handle
      url
      productCount
      coverImage {
        url
        alt
      }
    }
  }
  featured: collection(handle: "todas") {
    name
    url
    productCount
    coverImage {
      url
      alt
    }
    products(first: 8, sortBy: "best-selling") {
      nodes {
        id
        handle
        url
        title
        price
        priceMin
        priceMax
        compareAtPrice
        currency
        available
        coverImage {
          url
          alt
        }
        rating
        reviewsCount
        variants {
          id
          sku
          price
          stock
          available
        }
      }
      totalCount
    }
  }
  editorial: collection(handle: "vajilla") {
    url
  }
  decoration: collection(handle: "decoracion") {
    url
  }
  posts: blogPosts(first: 3) {
    nodes {
      url
      title
      excerpt
      publishedAt
      coverImage {
        url
        alt
      }
    }
  }
}
