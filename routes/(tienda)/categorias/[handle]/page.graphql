query ($handle: String!, $sort: ProductSort, $page: Int = 1) {
  collection(handle: $handle) @required {
    name description defaultSortBy
    seo { title description }
    sortOptions { value label }
    products(first: 24, page: $page, sortBy: $sort) {
      nodes { url title price currency coverImage { url alt } }
      pageInfo { currentPage totalPages hasNextPage hasPreviousPage }
      totalCount
    }
  }
}
